<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDEX Workbench</title><style>
body{font:15px system-ui;margin:0;color:#202124}header{padding:15px 18px;border-bottom:1px solid #ddd;font-size:20px;font-weight:650}
main{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 56px)}nav{border-right:1px solid #ddd;padding:10px}nav button{display:block;width:100%;text-align:left;padding:10px;border:0;background:none;border-radius:7px}
section{padding:18px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}a{cursor:pointer;text-decoration:underline}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:140px}.btn{padding:9px 12px;border:1px solid #bbb;border-radius:7px;background:white}.primary{font-weight:650}.danger{color:#a00}
.card{max-width:700px}.field{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:8px 0}.field input,.field select,.toolbar input{padding:9px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box;width:100%}.muted{color:#666}
@media(max-width:650px){main{grid-template-columns:110px 1fr}nav{padding:6px}section{padding:12px}.field{grid-template-columns:1fr}.hide-mobile{display:none}}
</style></head>
<body><header>MDEX Workbench</header><main><nav id="entities"></nav><section id="content">Loading…</section></main>
<script>
let model,current;
async function api(path,options={}){if(options.body){options.headers={"content-type":"application/json"};options.body=JSON.stringify(options.body)}const r=await fetch(path,options);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.status===204?null:r.json()}
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function start(){model=await api("/model");entities.innerHTML=Object.keys(model).map(n=>`<button onclick="list('${n}')">${n}</button>`).join("");list(Object.keys(model)[0])}
async function list(name,q=""){current=name;let rows=await api("/data/"+name);if(q){q=q.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)))}const e=model[name],attrs=Object.keys(e.attributes);
content.innerHTML=`<h2>${name}</h2><div class="toolbar"><input id="q" placeholder="Search ${name}" value="${esc(q)}" oninput="list('${name}',this.value)"><button class="btn primary" onclick="edit('${name}')">+ Create</button></div><p class="muted">${rows.length} records</p><table><tr>${attrs.map(a=>`<th>${a}</th>`).join("")}</tr>${rows.map(r=>`<tr>${attrs.map(a=>`<td>${cell(e,a,r[a],r[e.key])}</td>`).join("")}</tr>`).join("")}</table>`}
function cell(e,a,v,id){const s=e.attributes[a];if(a===e.key)return `<a onclick="show('${e.name}','${esc(id)}')">${esc(v)}</a>`;if(s.type==="reference"&&v)return `<a onclick="show('${s.entity}','${esc(v)}')">${esc(v)} →</a>`;return esc(v)}
async function show(name,id){const r=await api("/data/"+name+"/"+encodeURIComponent(id)),e=model[name];const custom=Object.entries(e.operations||{}).filter(([n,o])=>o.action==="custom"||o.action==="transition");
content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← ${name}</a></p><h2>${esc(r.name||id)}</h2><div class="toolbar"><button class="btn primary" onclick='edit("${name}",${JSON.stringify(JSON.stringify(r))})'>Edit</button><button class="btn danger" onclick="remove('${name}','${esc(id)}')">Delete</button>${custom.map(([n,o])=>`<button class="btn" onclick="operate('${name}','${esc(id)}','${n}')">${esc(o.label||n)}</button>`).join("")}</div>${Object.entries(e.attributes).map(([a,s])=>`<div class="field"><strong>${a}</strong><span>${s.type==="reference"&&r[a]?`<a onclick="show('${s.entity}','${esc(r[a])}')">${esc(r[a])} →</a>`:esc(r[a])}</span></div>`).join("")}${e.rules?`<h3>Business Rules</h3>${Object.values(e.rules).map(x=>`<p class="muted">• ${esc(x.description)}</p>`).join("")}`:""}</div>`}
async function operate(name,id,opName){const op=model[name].operations[opName],data={};for(const [p,s] of Object.entries(op.parameters||{})){if(s.type==="reference"){const rows=await api("/data/"+s.entity),key=model[s.entity].key;const answer=prompt((op.label||opName)+" — "+p+"\n"+rows.map(x=>x[key]+" : "+(x.name||"")).join("\n"));if(answer===null)return;data[p]=answer}else{const answer=prompt((op.label||opName)+" — "+p);if(answer===null)return;data[p]=answer}}try{await api("/api/"+name+"/"+opName,{method:"POST",body:{id,data}});show(name,id)}catch(e){alert(e.message)}}
async function edit(name,raw){const e=model[name],r=raw?JSON.parse(raw):{};const refs={};for(const [a,s] of Object.entries(e.attributes))if(s.type==="reference")refs[a]=await api("/data/"+s.entity);
content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← Cancel</a></p><h2>${raw?"Edit":"Create"} ${name}</h2><form id="form">${Object.entries(e.attributes).filter(([a,s])=>!(s.generated&&!raw)).map(([a,s])=>`<label class="field"><strong>${a}${s.required?" *":""}</strong>${s.type==="reference"?`<select name="${a}"><option value="">—</option>${refs[a].map(x=>`<option value="${esc(x[model[s.entity].key])}" ${x[model[s.entity].key]===r[a]?"selected":""}>${esc(x.name||x[model[s.entity].key])}</option>`).join("")}</select>`:`<input name="${a}" value="${esc(r[a])}" ${a===e.key&&raw?"readonly":""} ${s.required?"required":""}>`}</label>`).join("")}<button class="btn primary" type="submit">Save</button></form></div>`;
form.onsubmit=async ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>{if(data[k]==="")delete data[k]});try{if(raw){const id=r[e.key];delete data[e.key];await api("/data/"+name+"/"+encodeURIComponent(id),{method:"PATCH",body:data});show(name,id)}else{const x=await api("/data/"+name,{method:"POST",body:data});show(name,x[e.key])}}catch(err){alert(err.message)}}}
async function remove(name,id){if(!confirm("Delete this "+name+"?"))return;try{await api("/data/"+name+"/"+encodeURIComponent(id),{method:"DELETE"});list(name)}catch(e){alert(e.message)}}
start().catch(e=>content.textContent=e.message);
</script></body></html>
