<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDEX Workbench</title><style>
body{font:15px system-ui;margin:0;color:#202124}header{padding:15px 18px;border-bottom:1px solid #ddd;font-size:20px;font-weight:650}
main{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 56px)}nav{border-right:1px solid #ddd;padding:10px;position:relative;padding-bottom:42px}.version{position:absolute;left:10px;bottom:12px;font-size:12px;color:#777}nav button{display:block;width:100%;text-align:left;padding:10px;border:0;background:none;border-radius:7px}
section{padding:18px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}a{cursor:pointer;text-decoration:underline}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:140px}.btn{padding:9px 12px;border:1px solid #bbb;border-radius:7px;background:white}.primary{font-weight:650}.danger{color:#a00}.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-nav-icons{display:flex;gap:6px}.icon-btn{width:38px;height:38px;padding:0;text-align:center;font-size:17px}
.card{max-width:700px}.note{border-left:3px solid #bbb;padding:8px 12px;margin:8px 0;background:#fafafa}.note textarea{width:100%;min-height:80px;box-sizing:border-box}.field{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:8px 0}.field input,.field select,.field textarea,.toolbar input{padding:9px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box;width:100%}.field textarea{min-height:140px}.muted{color:#666}.smart-field{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0}.smart-field textarea{width:100%;min-height:170px;box-sizing:border-box;font:13px ui-monospace,monospace}.valid{color:#18743a}.invalid{color:#b00020}.system-panel{border:1px solid #ccc;border-radius:8px;background:#fafafa;padding:14px;margin:12px 0}.system-panel[hidden]{display:none}.system-panel-header{display:flex;align-items:center;justify-content:space-between}.tabs{display:flex;gap:4px;border-bottom:1px solid #ddd;margin:18px 0 10px}.tab{padding:9px 12px;border:0;background:none;font-weight:600}.tab.active{border-bottom:2px solid #202124}
@media(max-width:650px){main{grid-template-columns:110px 1fr}nav{padding:6px}section{padding:12px}.field{grid-template-columns:1fr}.hide-mobile{display:none}}
</style></head>
<body><header>MDEX Workbench</header><main><nav><div id="entities"></div><div id="version" class="version"></div></nav><section id="content">Loading…</section></main>
<script>
let model,useCases,architecture,current;
async function api(path,options={}){if(options.body){options.headers={"content-type":"application/json"};options.body=JSON.stringify(options.body)}const r=await fetch(path,options);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.status===204?null:r.json()}
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function start(){const v=await api("/version");version.textContent="v"+v.version;watchForReload(v.instanceId);model=await api("/model");useCases=await api("/use-cases");architecture=await api("/architecture");entities.innerHTML=`<strong>Entities</strong>${Object.keys(model).map(n=>`<button onclick="list('${n}')">${n}</button>`).join("")}<br><strong>Use Cases</strong>${Object.keys(useCases).map(n=>`<button onclick="showUseCase(\'${n}\')">${useCases[n].title||n}</button>`).join("")}<br><strong>Architecture</strong><button onclick="showArchitecture()">Architecture</button><br><strong>Manage</strong><button onclick="showNotes()">Notes</button>`;list(Object.keys(model)[0])}
function watchForReload(instanceId){setInterval(async()=>{try{const currentVersion=await api("/version");if(currentVersion.instanceId!==instanceId)location.reload()}catch{}},500)}

async function notesHtml(target){const notes=await api("/notes?target="+encodeURIComponent(target));return `<div class="notes"><h3>Notes to Designer</h3><div class="note"><textarea id="new-note" placeholder="Write a note or request a change…"></textarea><div class="toolbar"><button class="btn primary" onclick="saveNewNote('${esc(target)}')">Add Note</button></div></div>${notes.length?notes.map(n=>`<div class="note"><textarea id="note-${esc(n.id)}" ${n.status==="Resolved"?"disabled":""}>${esc(n.text)}</textarea><div class="toolbar"><small class="muted">${esc(n.status)} · ${esc(new Date(n.createdAt).toLocaleString())}</small>${n.status==="Open"?`<button class="btn" onclick="saveNote('${esc(n.id)}')">Save</button>`:""}<button class="btn danger" onclick="deleteNote('${esc(n.id)}')">Delete</button>${n.status==="Open"?`<button class="btn" onclick="resolveNote('${esc(n.id)}')">Resolve</button>`:""}</div></div>`).join(""):`<p class="muted">No notes yet.</p>`}</div>`}
async function saveNewNote(target){const el=document.getElementById("new-note"),text=el.value.trim();if(!text)return;await api("/notes",{method:"POST",body:{target,text}});await refreshCurrent()}
async function saveNote(id){const text=document.getElementById("note-"+id).value.trim();if(!text)return;await api("/notes/"+encodeURIComponent(id),{method:"PATCH",body:{text}});await refreshCurrent()}
async function deleteNote(id){if(!confirm("Delete this note?"))return;await api("/notes/"+encodeURIComponent(id),{method:"DELETE"});await refreshCurrent()}
async function resolveNote(id){const el=document.getElementById("note-"+id);const text=el?.value.trim();await api("/notes/"+encodeURIComponent(id),{method:"PATCH",body:{status:"Resolved",...(text?{text}:{})}});await refreshCurrent()}
async function refreshCurrent(){if(!current)return;if(current.kind==="design")return editEntityDesign(current.name);if(current.kind==="notes")return showNotes();if(current.kind==="architecture-edit")return editArchitecture();if(current.kind==="list")return list(current.name,current.query);if(current.kind==="edit")return edit(current.name,current.raw);if(current.kind==="entity")return show(current.name,current.id);if(current.kind==="usecase")return showUseCase(current.name);if(current.kind==="architecture")return showArchitecture()}
async function editEntityDesign(name){current={kind:"design",name};const entity=model[name],features=entity.architectureFeatures||{},attributes=Object.entries(entity.attributes||{}),references=attributes.filter(([,spec])=>spec.type==="reference"),children=Object.entries(entity.children||{}),operations=Object.entries(entity.operations||{}),rules=Object.entries(entity.rules||{}),states=entity.states,transitions=Object.entries(entity.transitions||{});content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← ${name}</a></p><div class="toolbar"><h2>${esc(name)} Entity Design</h2><button class="btn primary" onclick="editEntityModel('${name}')">Edit Model</button></div><p class="muted">Semantic application knowledge interpreted by the generic runtime.</p><h3>Architecture Features</h3><form id="design-form"><label class="field"><strong>Audit stamp</strong><input type="checkbox" name="auditStamp" ${features.auditStamp?"checked":""}></label><label class="field"><strong>Track history</strong><input type="checkbox" name="trackHistory" ${features.trackHistory?"checked":""}></label><button class="btn primary" type="submit">Save Features</button></form><h3>Attributes</h3><table><tr><th>Name</th><th>Type</th><th>Properties</th></tr>${attributes.map(([attribute,spec])=>`<tr><td>${esc(attribute)}</td><td>${esc(spec.type)}</td><td>${esc([spec.required&&"required",spec.generated&&"generated",spec.readOnly&&"read-only",spec.default!==undefined&&`default: ${spec.default}`].filter(Boolean).join(", ")||"—")}</td></tr>`).join("")}</table><h3>Relationships</h3>${references.length||children.length?`<table><tr><th>Name</th><th>Target</th><th>Kind</th></tr>${references.map(([attribute,spec])=>`<tr><td>${esc(attribute)}</td><td>${esc(spec.entity)}</td><td>reference</td></tr>`).join("")}${children.map(([relationship,spec])=>`<tr><td>${esc(spec.label||relationship)}</td><td>${esc(spec.entity)}</td><td>${esc(spec.ownership||"related collection")}</td></tr>`).join("")}</table>`:`<p class="muted">No relationships declared.</p>`}<h3>Operations</h3>${operations.length?`<table><tr><th>Name</th><th>Action</th><th>Label</th></tr>${operations.map(([operation,spec])=>`<tr><td>${esc(operation)}</td><td>${esc(spec.action||"—")}</td><td>${esc(spec.label||"—")}</td></tr>`).join("")}</table>`:`<p class="muted">No operations declared.</p>`}<h3>Rules</h3>${rules.length?`<table><tr><th>Name</th><th>Description</th></tr>${rules.map(([rule,spec])=>`<tr><td>${esc(rule)}</td><td>${esc(spec.description||spec.message||"—")}</td></tr>`).join("")}</table>`:`<p class="muted">No rules declared.</p>`}<h3>States & Transitions</h3>${states?`<div class="field"><strong>State attribute</strong><span>${esc(entity.stateAttribute||"—")}</span></div><div class="field"><strong>Initial state</strong><span>${esc(states.initial||"—")}</span></div><div class="field"><strong>States</strong><span>${esc((states.values||[]).join(", "))}</span></div>${transitions.length?`<table><tr><th>Transition</th><th>From</th><th>To</th></tr>${transitions.map(([transition,spec])=>`<tr><td>${esc(transition)}</td><td>${esc((spec.from||[]).join(", "))}</td><td>${esc(spec.to)}</td></tr>`).join("")}</table>`:""}`:`<p class="muted">No state model declared.</p>`}</div>`;document.getElementById("design-form").onsubmit=async event=>{event.preventDefault();const data=new FormData(event.currentTarget);model[name]=await api("/model/"+encodeURIComponent(name)+"/design",{method:"PATCH",body:{architectureFeatures:{auditStamp:data.has("auditStamp"),trackHistory:data.has("trackHistory")}}});editEntityDesign(name)}}
const smartTemplates={attributes:{type:"string"},children:{entity:"",foreignKey:"",ownership:"composition",label:""},operations:{action:"custom",label:""},rules:{description:"",message:""},transitions:{from:[],to:""}};
function smartField(label,name,value,help,add=true){return `<section class="smart-field"><div class="toolbar"><strong>${esc(label)}</strong><span id="valid-${name}" class="valid">Valid</span>${add?`<button class="btn" type="button" onclick="addSmartItem('${name}')">+ Add</button>`:""}<button class="btn" type="button" onclick="formatSmartField('${name}')">Format</button></div><p class="muted">${esc(help)}</p><textarea name="${name}" oninput="validateSmartEditor()">${esc(JSON.stringify(value||{},null,2))}</textarea></section>`}
function smartValue(name){const field=document.querySelector(`[name="${name}"]`),value=JSON.parse(field.value);if(!value||Array.isArray(value)||typeof value!=="object")throw new Error(name+" must be an object");return value}
function formatSmartField(name){try{const field=document.querySelector(`[name="${name}"]`);field.value=JSON.stringify(smartValue(name),null,2)}catch(error){alert(error.message)}validateSmartEditor()}
function addSmartItem(name){try{const value=smartValue(name),singular={attributes:"attribute",children:"relationship",operations:"operation",rules:"rule",transitions:"transition"}[name]||"item",key=prompt("Name for the new "+singular);if(!key)return;if(value[key])throw new Error(key+" already exists");value[key]=structuredClone(smartTemplates[name]||{});if(value[key].label!==undefined)value[key].label=key;document.querySelector(`[name="${name}"]`).value=JSON.stringify(value,null,2);validateSmartEditor()}catch(error){alert(error.message)}}
function validateSmartEditor(){let valid=true;for(const name of ["attributes","children","operations","rules","states","transitions"]){const badge=document.getElementById("valid-"+name);try{smartValue(name);badge.textContent="Valid";badge.className="valid"}catch(error){valid=false;badge.textContent=error.message;badge.className="invalid"}}const save=document.getElementById("save-entity-model");if(save)save.disabled=!valid;return valid}
async function editEntityModel(name){const entity=model[name];content.innerHTML=`<div class="card"><p><a onclick="editEntityDesign('${name}')">← Cancel</a></p><h2>Smart Editor · ${esc(name)}</h2><p class="muted">Add common definitions with guided templates, then refine the full semantic vocabulary when needed.</p><form id="entity-model-form">${smartField("Attributes","attributes",entity.attributes,"Declare type, required, generated, readOnly, enum values, or reference targets.")}${smartField("Relationships","children",entity.children,"Declare owned or related child collections with entity, foreignKey, ownership, and label.")}${smartField("Operations","operations",entity.operations,"Declare an action and optional label, parameters, rules, set, create, or transition behavior.")}${smartField("Rules","rules",entity.rules,"Declare descriptions, conditions, forbidden values, and business messages.")}<label class="field"><strong>State attribute</strong><input name="stateAttribute" value="${esc(entity.stateAttribute||"")}"></label>${smartField("States","states",entity.states,"Declare initial and allowed state values.",false)}${smartField("Transitions","transitions",entity.transitions,"Declare from/to states and attached rules.")}<button id="save-entity-model" class="btn primary" type="submit">Save Entity Design</button></form></div>`;validateSmartEditor();document.getElementById("entity-model-form").onsubmit=async event=>{event.preventDefault();if(!validateSmartEditor())return;const data=new FormData(event.currentTarget);try{const body={stateAttribute:String(data.get("stateAttribute")||"").trim(),attributes:smartValue("attributes"),children:smartValue("children"),operations:smartValue("operations"),rules:smartValue("rules"),states:smartValue("states"),transitions:smartValue("transitions")};model[name]=await api("/model/"+encodeURIComponent(name)+"/design",{method:"PATCH",body});editEntityDesign(name)}catch(error){alert(error.message)}}}
function noteTargets(){return [...Object.keys(model).map(name=>["entity:"+name,name]),...Object.entries(useCases).map(([name,u])=>["use-case:"+name,u.title||name]),["architecture:"+architecture.architecture.name,architecture.architecture.title||architecture.architecture.name]]}
function targetOptions(selected=""){return noteTargets().map(([value,label])=>`<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(label)} (${esc(value.split(":")[0])})</option>`).join("")}
async function showNotes(){current={kind:"notes"};const notes=await api("/notes");content.innerHTML=`<div class="card"><h2>Notes</h2><p class="muted">Manage requests and review comments without changing application knowledge.</p><div class="note"><h3>Add Note</h3><label class="field"><strong>Target</strong><select id="manage-new-target">${targetOptions()}</select></label><label class="field"><strong>Note</strong><textarea id="manage-new-text" placeholder="Write a note or request a change…"></textarea></label><button class="btn primary" onclick="addManagedNote()">Add Note</button></div><h3>All Notes</h3>${notes.length?notes.map(n=>`<div class="note"><label class="field"><strong>Target</strong><select id="manage-target-${esc(n.id)}">${targetOptions(n.target)}</select></label><label class="field"><strong>Note</strong><textarea id="manage-text-${esc(n.id)}">${esc(n.text)}</textarea></label><label class="field"><strong>Status</strong><select id="manage-status-${esc(n.id)}"><option ${n.status==="Open"?"selected":""}>Open</option><option ${n.status==="Resolved"?"selected":""}>Resolved</option></select></label><div class="toolbar"><button class="btn primary" onclick="updateManagedNote('${esc(n.id)}')">Save</button><button class="btn danger" onclick="deleteManagedNote('${esc(n.id)}')">Delete</button><small class="muted">Created ${esc(new Date(n.createdAt).toLocaleString())}</small></div></div>`).join(""):`<p class="muted">No notes yet.</p>`}</div>`}
async function addManagedNote(){const target=document.getElementById("manage-new-target").value,text=document.getElementById("manage-new-text").value.trim();if(!text)return;await api("/notes",{method:"POST",body:{target,text}});showNotes()}
async function updateManagedNote(id){const target=document.getElementById("manage-target-"+id).value,text=document.getElementById("manage-text-"+id).value.trim(),status=document.getElementById("manage-status-"+id).value;if(!text)return;await api("/notes/"+encodeURIComponent(id),{method:"PATCH",body:{target,text,status}});showNotes()}
async function deleteManagedNote(id){if(!confirm("Delete this note?"))return;await api("/notes/"+encodeURIComponent(id),{method:"DELETE"});showNotes()}
async function showArchitecture(){current={kind:"architecture"};const a=architecture.architecture,f=architecture.findings;const nh=await notesHtml("architecture:"+a.name);content.innerHTML=`<div class="card"><div class="toolbar"><h2>${esc(a.title||a.name)}</h2><button class="btn primary" onclick="editArchitecture()">Edit</button></div><h3>Principles</h3>${(a.principles||[]).map(x=>`<p>• ${esc(x)}</p>`).join("")}<h3>Constraints</h3><table><tr><th>Constraint</th><th>Value</th></tr>${Object.entries(a.constraints||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table><h3>Architecture Validation</h3><p class="muted">${f.filter(x=>x.status==="Pass").length} passed · ${f.filter(x=>x.status==="Fail").length} failed</p><table><tr><th>Status</th><th>Subject</th><th>Finding</th></tr>${f.map(x=>`<tr><td>${esc(x.status)}</td><td>${esc(x.subject)}</td><td>${esc(x.message)}</td></tr>`).join("")}</table>${nh}</div>`}
function constraintInput(name,value){if(typeof value==="boolean")return `<select name="constraint:${esc(name)}"><option value="true" ${value?"selected":""}>true</option><option value="false" ${!value?"selected":""}>false</option></select>`;return `<input name="constraint:${esc(name)}" value="${esc(value)}">`}
async function editArchitecture(){current={kind:"architecture-edit"};const a=architecture.architecture;content.innerHTML=`<div class="card"><p><a onclick="showArchitecture()">← Cancel</a></p><h2>Edit Architecture</h2><form id="architecture-form"><label class="field"><strong>Title</strong><input name="title" value="${esc(a.title||"")}" required></label><label class="field"><strong>Principles</strong><textarea name="principles" required>${esc((a.principles||[]).join("\n"))}</textarea></label><h3>Constraints</h3>${Object.entries(a.constraints||{}).map(([name,value])=>`<label class="field"><strong>${esc(name)}</strong>${constraintInput(name,value)}</label>`).join("")}<button class="btn primary" type="submit">Save</button></form></div>`;document.getElementById("architecture-form").onsubmit=saveArchitecture}
async function saveArchitecture(event){event.preventDefault();const form=new FormData(event.currentTarget),currentConstraints=architecture.architecture.constraints||{},constraints={};for(const [name,oldValue] of Object.entries(currentConstraints)){const value=form.get("constraint:"+name);constraints[name]=typeof oldValue==="boolean"?value==="true":typeof oldValue==="number"?Number(value):value}const principles=String(form.get("principles")||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);try{architecture=await api("/architecture",{method:"PATCH",body:{title:String(form.get("title")||"").trim(),principles,constraints}});showArchitecture()}catch(error){alert(error.message)}}
async function showUseCase(name){current={kind:"usecase",name};const u=useCases[name],nh=await notesHtml("use-case:"+name);content.innerHTML=`<div class="card"><h2>${esc(u.title||name)}</h2><p><strong>Goal</strong><br>${esc(u.goal)}</p><p><strong>Actor</strong><br>${esc(u.actor||"—")}</p><h3>Inputs</h3><form id="ucform">${(await Promise.all(Object.entries(u.inputs).map(async([n,s])=>{if(s.entity){const rows=await api("/data/"+s.entity),e=model[s.entity],options=await Promise.all(rows.map(async r=>`<option value="${esc(r[e.key])}">${esc(await businessLabel(s.entity,r))}</option>`));return `<label class="field"><strong>${esc(n)}</strong><select name="${esc(n)}" required><option value="">Select…</option>${options.join("")}</select></label>`}if(s.type==="enum")return `<label class="field"><strong>${esc(n)}</strong><select name="${esc(n)}" required><option value="">Select…</option>${s.values.map(v=>`<option>${esc(v)}</option>`).join("")}</select></label>`;return `<label class="field"><strong>${esc(n)}</strong><input name="${esc(n)}" ${s.required?"required":""}></label>`}))).join("")}<h3>Flow</h3>${u.steps.map((s,i)=>`<p>${i+1}. ${esc(s.title||(s.invoke?`Invoke ${s.invoke.operation}`:"Step"))}</p>`).join("")}<p><strong>Outcome</strong><br>${esc(u.outcome)}</p><button class="btn primary" type="submit">Run</button></form><div id="ucresult"></div>${nh}</div>`;ucform.onsubmit=async ev=>{ev.preventDefault();try{const input=Object.fromEntries(new FormData(ucform));const r=await api("/use-cases/"+name+"/run",{method:"POST",body:input});ucresult.innerHTML=`<p><strong>Completed</strong><br>${esc(r.outcome)}</p>${(r.results||[]).map(x=>`<p>✓ ${esc(x.step)}. ${esc(x.title)}</p>`).join("")}`}catch(e){alert(e.message)}}}
async function list(name,q=""){current={kind:"list",name,query:q};let rows=await api("/data/"+name);if(q){const query=q.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(query)))}const e=model[name],attrs=visibleAttributes(e),nh=await notesHtml("entity:"+name),body=await Promise.all(rows.map(async r=>`<tr onclick="show(\'${name}\',\'${esc(r[e.key])}\')" style="cursor:pointer">${(await Promise.all(attrs.map(async a=>`<td>${await cell(e,a,r[a])}</td>`))).join("")}<td><button class="btn" title="System details" aria-label="System details" onclick="event.stopPropagation();openSystemDetails('${name}','${esc(r[e.key])}')">ⓘ</button></td></tr>`));
content.innerHTML=`<h2>${name}</h2><div class="toolbar"><input id="q" placeholder="Search ${name}" value="${esc(q)}" oninput="list('${name}',this.value)"><button class="btn primary" onclick="edit('${name}')">+ Create</button></div><p class="muted">${rows.length} records</p><table><tr>${attrs.map(a=>`<th>${a}</th>`).join("")}<th>System</th></tr>${body.join("")}</table>${nh}`}
function visibleAttributes(e){return Object.keys(e.attributes).filter(a=>!(architecture?.architecture?.constraints?.hideGeneratedKeys&&e.attributes[a].generated))}
function editableAttributes(e){return visibleAttributes(e).filter(a=>!e.attributes[a].readOnly)}
async function businessLabel(entity,r){const e=model[entity],field=e.display||"name",spec=e.attributes[field],value=r?.[field];if(spec?.type==="reference"&&value)return refLabel(spec,value);return value||r?.name||""}
async function openSystemDetails(name,id){await show(name,id);await toggleSystemDetails(name,id,true)}
async function toggleSystemDetails(name,id,open){const panel=document.getElementById("system-details");if(!panel)return;const shouldOpen=open===true||panel.hidden;if(!shouldOpen){panel.hidden=true;return}if(!panel.dataset.loaded){const e=model[name],record=await api("/data/"+name+"/"+encodeURIComponent(id)),history=e.architectureFeatures?.trackHistory?await api("/history/"+name+"/"+encodeURIComponent(id)):[],audit=record._audit||{};panel.innerHTML=`<div class="system-panel-header"><h3>System Details</h3><button class="btn" onclick="toggleSystemDetails('${name}','${esc(id)}',false)">Close</button></div><div class="field"><strong>System ID</strong><span>${esc(record[e.key])}</span></div><div class="field"><strong>Created</strong><span>${audit.createdAt?esc(new Date(audit.createdAt).toLocaleString()):"Not tracked"}</span></div><div class="field"><strong>Created by</strong><span>${esc(audit.createdBy||"Not tracked")}</span></div><div class="field"><strong>Updated</strong><span>${audit.updatedAt?esc(new Date(audit.updatedAt).toLocaleString()):"Not tracked"}</span></div><div class="field"><strong>Updated by</strong><span>${esc(audit.updatedBy||"Not tracked")}</span></div><h3>History</h3>${history.length?`<table><tr><th>Action</th><th>Time</th><th>Actor</th></tr>${history.slice().reverse().map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(new Date(x.at).toLocaleString())}</td><td>${esc(x.actor||"System")}</td></tr>`).join("")}</table>`:`<p class="muted">History is not enabled or no changes have been recorded.</p>`}`;panel.dataset.loaded="true"}panel.hidden=false}
async function refLabel(s,v){if(!v)return "";try{return await businessLabel(s.entity,await api("/data/"+s.entity+"/"+encodeURIComponent(v)))}catch{return "Unknown"}}
async function cell(e,a,v){const s=e.attributes[a];if(s.type==="reference"&&v)return `<a onclick="show('${s.entity}','${esc(v)}')">${esc(await refLabel(s,v))} →</a>`;return esc(v)}
async function show(name,id){current={kind:"entity",name,id};const r=await api("/data/"+name+"/"+encodeURIComponent(id)),e=model[name],nh=await notesHtml("entity:"+name);const custom=Object.entries(e.operations||{}).filter(([n,o])=>o.action==="custom"||o.action==="transition"),children=Object.entries(e.children||{}),fields=await Promise.all(visibleAttributes(e).map(async a=>{const s=e.attributes[a],value=s.type==="reference"&&r[a]?`<a onclick="show('${s.entity}','${esc(r[a])}')">${esc(await refLabel(s,r[a]))} →</a>`:esc(r[a]);return `<div class="field"><strong>${a}</strong><span>${value}</span></div>`}));
content.innerHTML=`<div class="card"><div class="detail-nav"><a onclick="list('${name}')">← ${name}</a><div class="detail-nav-icons"><button class="btn icon-btn" title="System details" aria-label="System details" onclick="toggleSystemDetails('${name}','${esc(id)}')">ⓘ</button><button class="btn icon-btn" title="Design options" aria-label="Design options" onclick="editEntityDesign('${name}')">⚙</button></div></div><div id="system-details" class="system-panel" hidden></div><h2>${esc(await businessLabel(name,r))}</h2><div class="toolbar"><button class="btn primary" onclick='edit("${name}",${JSON.stringify(JSON.stringify(r))})'>Edit</button><button class="btn danger" onclick="remove('${name}','${esc(id)}')">Delete</button>${custom.map(([n,o])=>`<button class="btn" onclick="operate('${name}','${esc(id)}','${n}')">${esc(o.label||n)}</button>`).join("")}</div>${fields.join("")}${e.rules?`<h3>Business Rules</h3>${Object.values(e.rules).map(x=>`<p class="muted">• ${esc(x.description)}</p>`).join("")}`:""}${nh}${children.length?`<div class="tabs">${children.map(([k,ch])=>`<button id="tab-${k}" class="tab" onclick="childTab(\'${name}\',\'${esc(id)}\',\'${k}\')">${esc(ch.label||k)}</button>`).join("")}</div><div id="child-content" class="muted">Select a tab.</div>`:""}</div>`;if(children.length)childTab(name,id,children[0][0])}
async function childTab(parent,id,key){const p=model[parent],child=p.children[key],ce=model[child.entity],rows=await api("/data/"+child.entity+"?"+encodeURIComponent(child.foreignKey)+"="+encodeURIComponent(id));const attrs=visibleAttributes(ce).filter(a=>a!==child.foreignKey);let body="";for(const r of rows){let cells="";for(const a of attrs){const s=ce.attributes[a];let v=r[a];if(s.type==="reference")v=await refLabel(s,v);cells+=`<td>${esc(v)}</td>`}body+=`<tr>${cells}<td><div class="toolbar"><button class="btn" onclick='editChild("${parent}","${esc(id)}","${key}",${JSON.stringify(JSON.stringify(r))})'>Edit</button><button class="btn danger" onclick="removeChild('${parent}','${esc(id)}','${key}','${esc(r[ce.key])}')">Remove</button></div></td></tr>`}document.getElementById("child-content").innerHTML=`<div class="toolbar"><strong>${esc(child.label||key)}</strong><span class="muted">${rows.length} records</span><button class="btn primary" onclick="editChild('${parent}','${esc(id)}','${key}')">+ Add</button></div><table><tr>${attrs.map(a=>`<th>${a}</th>`).join("")}<th>Actions</th></tr>${body}</table>`;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("tab-"+key).classList.add("active")}
async function editChild(parent,parentId,key,raw){const child=model[parent].children[key],name=child.entity,e=model[name],record=raw?JSON.parse(raw):{},refs={};for(const [a,s] of Object.entries(e.attributes))if(s.type==="reference"&&a!==child.foreignKey)refs[a]=await api("/data/"+s.entity);const attrs=editableAttributes(e).filter(a=>a!==child.foreignKey),fields=await Promise.all(attrs.map(async a=>{const s=e.attributes[a];if(s.type==="reference"){const options=await Promise.all(refs[a].map(async x=>`<option value="${esc(x[model[s.entity].key])}" ${x[model[s.entity].key]===record[a]?"selected":""}>${esc(await businessLabel(s.entity,x))}</option>`));return `<label class="field"><strong>${a}${s.required?" *":""}</strong><select name="${a}"><option value="">—</option>${options.join("")}</select></label>`}if(s.type==="enum")return `<label class="field"><strong>${a}${s.required?" *":""}</strong><select name="${a}">${(s.values||[]).map(v=>`<option ${v===record[a]?"selected":""}>${esc(v)}</option>`).join("")}</select></label>`;return `<label class="field"><strong>${a}${s.required?" *":""}</strong><input name="${a}" value="${esc(record[a])}" ${s.required?"required":""}></label>`}));content.innerHTML=`<div class="card"><p><a onclick="show('${parent}','${esc(parentId)}')">← Cancel</a></p><h2>${raw?"Edit":"Add"} ${esc(name)}</h2><form id="child-form">${fields.join("")}<button class="btn primary" type="submit">Save</button></form></div>`;document.getElementById("child-form").onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));Object.keys(data).forEach(k=>{if(data[k]==="")delete data[k]});if(raw){await api("/data/"+name+"/"+encodeURIComponent(record[e.key]),{method:"PATCH",body:data})}else{data[child.foreignKey]=parentId;await api("/data/"+name,{method:"POST",body:data})}await show(parent,parentId);await childTab(parent,parentId,key)}}
async function removeChild(parent,parentId,key,childId){if(!confirm("Remove this related record?"))return;const child=model[parent].children[key];await api("/data/"+child.entity+"/"+encodeURIComponent(childId),{method:"DELETE"});await show(parent,parentId);await childTab(parent,parentId,key)}
async function operate(name,id,opName){const op=model[name].operations[opName],data={};for(const [p,s] of Object.entries(op.parameters||{})){if(s.type==="reference"){const rows=await api("/data/"+s.entity),key=model[s.entity].key,labels=await Promise.all(rows.map(x=>businessLabel(s.entity,x))),answer=prompt((op.label||opName)+" — "+p+"\n"+labels.map((value,index)=>(index+1)+". "+value).join("\n"));if(answer===null)return;const selected=rows[Number(answer)-1];if(!selected){alert("Select a valid number.");return}data[p]=selected[key]}else{const answer=prompt((op.label||opName)+" — "+p);if(answer===null)return;data[p]=answer}}try{await api("/api/"+name+"/"+opName,{method:"POST",body:{id,data}});show(name,id)}catch(e){alert(e.message)}}
async function edit(name,raw){current={kind:"edit",name,raw};const e=model[name],r=raw?JSON.parse(raw):{},refs={};for(const [a,s] of Object.entries(e.attributes))if(s.type==="reference")refs[a]=await api("/data/"+s.entity);const nh=await notesHtml("entity:"+name),fields=await Promise.all(editableAttributes(e).map(async a=>{const s=e.attributes[a];if(s.type==="reference"){const options=await Promise.all(refs[a].map(async x=>`<option value="${esc(x[model[s.entity].key])}" ${x[model[s.entity].key]===r[a]?"selected":""}>${esc(await businessLabel(s.entity,x))}</option>`));return `<label class="field"><strong>${a}${s.required?" *":""}</strong><select name="${a}"><option value="">—</option>${options.join("")}</select></label>`}if(s.type==="enum")return `<label class="field"><strong>${a}${s.required?" *":""}</strong><select name="${a}">${(s.values||[]).map(v=>`<option ${v===r[a]?"selected":""}>${esc(v)}</option>`).join("")}</select></label>`;return `<label class="field"><strong>${a}${s.required?" *":""}</strong><input name="${a}" value="${esc(r[a])}" ${s.required?"required":""}></label>`}));
content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← Cancel</a></p><h2>${raw?"Edit":"Create"} ${name}</h2><form id="form">${fields.join("")}<button class="btn primary" type="submit">Save</button></form>${nh}</div>`;
form.onsubmit=async ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>{if(data[k]==="")delete data[k]});try{if(raw){const id=r[e.key];delete data[e.key];await api("/data/"+name+"/"+encodeURIComponent(id),{method:"PATCH",body:data});show(name,id)}else{const x=await api("/data/"+name,{method:"POST",body:data});show(name,x[e.key])}}catch(err){alert(err.message)}}}
async function remove(name,id){if(!confirm("Delete this "+name+"?"))return;try{await api("/data/"+name+"/"+encodeURIComponent(id),{method:"DELETE"});list(name)}catch(e){alert(e.message)}}
start().catch(e=>content.textContent=e.message);
</script></body></html>
