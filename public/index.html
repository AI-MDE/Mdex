<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDEX Workbench</title><style>
body{font:15px system-ui;margin:0;color:#202124}header{padding:15px 18px;border-bottom:1px solid #ddd;font-size:20px;font-weight:650}
main{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 56px)}nav{border-right:1px solid #ddd;padding:10px;position:relative;padding-bottom:42px}.version{position:absolute;left:10px;bottom:12px;font-size:12px;color:#777}nav button{display:block;width:100%;text-align:left;padding:10px;border:0;background:none;border-radius:7px}
section{padding:18px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}a{cursor:pointer;text-decoration:underline}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:140px}.btn{padding:9px 12px;border:1px solid #bbb;border-radius:7px;background:white}.primary{font-weight:650}.danger{color:#a00}
.card{max-width:700px}.note{border-left:3px solid #bbb;padding:8px 12px;margin:8px 0;background:#fafafa}.note textarea{width:100%;min-height:80px;box-sizing:border-box}.field{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:8px 0}.field input,.field select,.toolbar input{padding:9px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box;width:100%}.muted{color:#666}.tabs{display:flex;gap:4px;border-bottom:1px solid #ddd;margin:18px 0 10px}.tab{padding:9px 12px;border:0;background:none;font-weight:600}.tab.active{border-bottom:2px solid #202124}.model-editor{max-width:1000px}.model-editor input,.model-editor select{padding:7px;border:1px solid #bbb;border-radius:5px;box-sizing:border-box;width:100%}.model-editor table input,.model-editor table select{min-width:90px}.check{width:auto!important}
@media(max-width:650px){main{grid-template-columns:110px 1fr}nav{padding:6px}section{padding:12px}.field{grid-template-columns:1fr}.hide-mobile{display:none}}
</style></head>
<body><header>MDEX Workbench</header><main><nav><div id="entities"></div><div id="version" class="version"></div></nav><section id="content">Loading…</section></main>
<script>
let model,useCases,architecture,current;
async function api(path,options={}){if(options.body){options.headers={"content-type":"application/json"};options.body=JSON.stringify(options.body)}const r=await fetch(path,options);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.status===204?null:r.json()}
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function start(){const v=await api("/version");version.textContent="v"+v.version;model=await api("/model");useCases=await api("/use-cases");architecture=await api("/architecture");entities.innerHTML=`<strong>Entities</strong>${Object.keys(model).map(n=>`<button onclick="list('${n}')">${n}</button>`).join("")}<button onclick="entityEditor(Object.keys(model)[0])">⚙ Entity Editor</button><br><strong>Use Cases</strong>${Object.keys(useCases).map(n=>`<button onclick="showUseCase(\'${n}\')">${useCases[n].title||n}</button>`).join("")}<br><strong>Architecture</strong><button onclick="showArchitecture()">Architecture</button>`;list(Object.keys(model)[0])}


function attrRow(name="",s={}){const targets=Object.keys(model);return `<tr><td><input class="aname" value="${esc(name)}"></td><td><select class="atype" onchange="editorType(this)"><option>string</option><option>number</option><option>boolean</option><option>uuid</option><option>enum</option><option>reference</option></select></td><td><input class="arequired check" type="checkbox" ${s.required?"checked":""}></td><td><input class="agenerated check" type="checkbox" ${s.generated?"checked":""}></td><td class="aextra"><input value="${esc(s.type==="reference"?s.entity:s.type==="enum"?(s.values||[]).join(", "):"")}" placeholder="Reference entity / enum values"></td><td><button class="btn danger" onclick="this.closest('tr').remove()">×</button></td></tr>`}
function editorType(el){el.closest("tr").querySelector(".aextra input").placeholder=el.value==="reference"?"Entity name":el.value==="enum"?"Comma-separated values":"—"}
async function entityEditor(name){const e=JSON.parse(JSON.stringify(model[name]));current={kind:"entityEditor",name};content.innerHTML=`<div class="model-editor"><p><a onclick="list('${name}')">← Data</a></p><h2>Entity Editor</h2><div class="field"><strong>Name</strong><input id="ename" value="${esc(e.name)}"></div><div class="field"><strong>Key</strong><input id="ekey" value="${esc(e.key)}"></div><div class="field"><strong>Display</strong><input id="edisplay" value="${esc(e.display||"")}"></div><h3>Attributes</h3><table id="attrtable"><tr><th>Name</th><th>Type</th><th>Required</th><th>Generated</th><th>Reference / Values</th><th></th></tr>${Object.entries(e.attributes).map(([n,s])=>attrRow(n,s)).join("")}</table><div class="toolbar"><button class="btn" onclick="addAttr()">+ Attribute</button><button class="btn primary" onclick="saveEntityModel('${name}')">Save Entity</button></div><p class="muted">This edits the semantic entity artifact in sample/entities directly.</p></div>`;[...document.querySelectorAll("#attrtable tr")].slice(1).forEach((tr,i)=>tr.querySelector(".atype").value=Object.values(e.attributes)[i].type)}
function addAttr(){document.getElementById("attrtable").insertAdjacentHTML("beforeend",attrRow())}
async function saveEntityModel(oldName){const artifact=JSON.parse(JSON.stringify(model[oldName])),attrs={};for(const tr of [...document.querySelectorAll("#attrtable tr")].slice(1)){const n=tr.querySelector(".aname").value.trim(),type=tr.querySelector(".atype").value,extra=tr.querySelector(".aextra input").value.trim();if(!n)continue;const s={type};if(tr.querySelector(".arequired").checked)s.required=true;if(tr.querySelector(".agenerated").checked)s.generated=true;if(type==="reference"&&extra)s.entity=extra;if(type==="enum")s.values=extra.split(",").map(x=>x.trim()).filter(Boolean);attrs[n]=s}artifact.name=ename.value.trim();artifact.key=ekey.value.trim();artifact.display=edisplay.value.trim()||undefined;artifact.attributes=attrs;try{const saved=await api("/model/entities/"+encodeURIComponent(oldName),{method:"PUT",body:artifact});model=await api("/model");alert("Entity saved");entityEditor(saved.name)}catch(e){alert(e.message)}}

async function notesHtml(target){const notes=await api("/notes?target="+encodeURIComponent(target));return `<div class="notes"><h3>Notes to Designer</h3><div class="note"><textarea id="new-note" placeholder="Write a note or request a change…"></textarea><div class="toolbar"><button class="btn primary" onclick="saveNewNote('${esc(target)}')">Add Note</button></div></div>${notes.length?notes.map(n=>`<div class="note"><textarea id="note-${esc(n.id)}" ${n.status==="Resolved"?"disabled":""}>${esc(n.text)}</textarea><div class="toolbar"><small class="muted">${esc(n.status)} · ${esc(new Date(n.createdAt).toLocaleString())}</small>${n.status==="Open"?`<button class="btn" onclick="saveNote('${esc(n.id)}')">Save</button><button class="btn" onclick="resolveNote('${esc(n.id)}')">Resolve</button>`:""}</div></div>`).join(""):`<p class="muted">No notes yet.</p>`}</div>`}
async function saveNewNote(target){const el=document.getElementById("new-note"),text=el.value.trim();if(!text)return;await api("/notes",{method:"POST",body:{target,text}});await refreshCurrent()}
async function saveNote(id){const text=document.getElementById("note-"+id).value.trim();if(!text)return;await api("/notes/"+encodeURIComponent(id),{method:"PATCH",body:{text}});await refreshCurrent()}
async function resolveNote(id){const el=document.getElementById("note-"+id);const text=el?.value.trim();await api("/notes/"+encodeURIComponent(id),{method:"PATCH",body:{status:"Resolved",...(text?{text}:{})}});await refreshCurrent()}
async function refreshCurrent(){if(!current)return; if(current.kind==="entity")return show(current.name,current.id);if(current.kind==="entityEditor")return entityEditor(current.name);if(current.kind==="usecase")return showUseCase(current.name);if(current.kind==="architecture")return showArchitecture()}
async function showArchitecture(){current={kind:"architecture"};const a=architecture.architecture,f=architecture.findings;const nh=await notesHtml("architecture:"+a.name);content.innerHTML=`<div class="card"><h2>${esc(a.title||a.name)}</h2><h3>Principles</h3>${(a.principles||[]).map(x=>`<p>• ${esc(x)}</p>`).join("")}<h3>Constraints</h3><table><tr><th>Constraint</th><th>Value</th></tr>${Object.entries(a.constraints||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table><h3>Architecture Validation</h3><p class="muted">${f.filter(x=>x.status==="Pass").length} passed · ${f.filter(x=>x.status==="Fail").length} failed</p><table><tr><th>Status</th><th>Subject</th><th>Finding</th></tr>${f.map(x=>`<tr><td>${esc(x.status)}</td><td>${esc(x.subject)}</td><td>${esc(x.message)}</td></tr>`).join("")}</table>${nh}</div>`}
async function showUseCase(name){current={kind:"usecase",name};const u=useCases[name],nh=await notesHtml("use-case:"+name);content.innerHTML=`<div class="card"><h2>${esc(u.title||name)}</h2><p><strong>Goal</strong><br>${esc(u.goal)}</p><p><strong>Actor</strong><br>${esc(u.actor||"—")}</p><h3>Inputs</h3><form id="ucform">${(await Promise.all(Object.entries(u.inputs).map(async([n,s])=>{if(s.entity){const rows=await api("/data/"+s.entity),e=model[s.entity];return `<label class="field"><strong>${esc(n)}</strong><select name="${esc(n)}" required><option value="">Select…</option>${rows.map(r=>`<option value="${esc(r[e.key])}">${esc(label(s.entity,r))}</option>`).join("")}</select></label>`}if(s.type==="enum")return `<label class="field"><strong>${esc(n)}</strong><select name="${esc(n)}" required><option value="">Select…</option>${s.values.map(v=>`<option>${esc(v)}</option>`).join("")}</select></label>`;return `<label class="field"><strong>${esc(n)}</strong><input name="${esc(n)}" ${s.required?"required":""}></label>`}))).join("")}<h3>Flow</h3>${u.steps.map((s,i)=>`<p>${i+1}. ${esc(s.title||(s.invoke?`Invoke ${s.invoke.operation}`:"Step"))}</p>`).join("")}<p><strong>Outcome</strong><br>${esc(u.outcome)}</p><button class="btn primary" type="submit">Run</button></form><div id="ucresult"></div>${nh}</div>`;ucform.onsubmit=async ev=>{ev.preventDefault();try{const input=Object.fromEntries(new FormData(ucform));const r=await api("/use-cases/"+name+"/run",{method:"POST",body:input});ucresult.innerHTML=`<p><strong>Completed</strong><br>${esc(r.outcome)}</p>${(r.results||[]).map(x=>`<p>✓ ${esc(x.step)}. ${esc(x.title)}</p>`).join("")}`}catch(e){alert(e.message)}}}
async function list(name,q=""){current=name;let rows=await api("/data/"+name);if(q){q=q.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)))}const e=model[name],attrs=Object.keys(e.attributes).filter(a=>!(architecture?.architecture?.constraints?.hideGeneratedKeys&&e.attributes[a].generated));
content.innerHTML=`<h2>${name}</h2><div class="toolbar"><input id="q" placeholder="Search ${name}" value="${esc(q)}" oninput="list('${name}',this.value)"><button class="btn primary" onclick="edit('${name}')">+ Create</button></div><p class="muted">${rows.length} records</p><table><tr>${attrs.map(a=>`<th>${a}</th>`).join("")}</tr>${rows.map(r=>`<tr onclick="show(\'${name}\',\'${esc(r[e.key])}\')" style="cursor:pointer">${attrs.map(a=>`<td>${cell(e,a,r[a],r[e.key])}</td>`).join("")}</tr>`).join("")}</table>`}
function label(entity,r){const e=model[entity],f=e.display||"name";return r?.[f]||r?.name||r?.[e.key]||""}
async function refLabel(s,v){if(!v)return "";try{return label(s.entity,await api("/data/"+s.entity+"/"+encodeURIComponent(v)))}catch{return v}}
function cell(e,a,v,id){const s=e.attributes[a];if(a===e.key)return esc(v);if(s.type==="reference"&&v)return `<a onclick="show('${s.entity}','${esc(v)}')">${esc(v)} →</a>`;return esc(v)}
async function show(name,id){current={kind:"entity",name,id};const r=await api("/data/"+name+"/"+encodeURIComponent(id)),e=model[name],nh=await notesHtml("entity:"+name);const custom=Object.entries(e.operations||{}).filter(([n,o])=>o.action==="custom"||o.action==="transition");const children=Object.entries(e.children||{});
content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← ${name}</a></p><h2>${esc(r.name||id)}</h2><div class="toolbar"><button class="btn primary" onclick='edit("${name}",${JSON.stringify(JSON.stringify(r))})'>Edit</button><button class="btn danger" onclick="remove('${name}','${esc(id)}')">Delete</button>${custom.map(([n,o])=>`<button class="btn" onclick="operate('${name}','${esc(id)}','${n}')">${esc(o.label||n)}</button>`).join("")}</div>${Object.entries(e.attributes).map(([a,s])=>`<div class="field"><strong>${a}</strong><span>${s.type==="reference"&&r[a]?`<a onclick="show('${s.entity}','${esc(r[a])}')">${esc(r[a])} →</a>`:esc(r[a])}</span></div>`).join("")}${e.rules?`<h3>Business Rules</h3>${Object.values(e.rules).map(x=>`<p class="muted">• ${esc(x.description)}</p>`).join("")}`:""}${nh}${children.length?`<div class="tabs">${children.map(([k,ch])=>`<button id="tab-${k}" class="tab" onclick="childTab(\'${name}\',\'${esc(id)}\',\'${k}\')">${esc(ch.label||k)}</button>`).join("")}</div><div id="child-content" class="muted">Select a tab.</div>`:""}</div>`;if(children.length)childTab(name,id,children[0][0])}
async function childTab(parent,id,key){const p=model[parent],child=p.children[key],ce=model[child.entity],rows=await api("/data/"+child.entity+"?"+encodeURIComponent(child.foreignKey)+"="+encodeURIComponent(id));const attrs=Object.keys(ce.attributes).filter(a=>a!==ce.key&&a!==child.foreignKey);let body="";for(const r of rows){let cells="";for(const a of attrs){const s=ce.attributes[a];let v=r[a];if(s.type==="reference")v=await refLabel(s,v);cells+=`<td>${esc(v)}</td>`}body+=`<tr>${cells}</tr>`}document.getElementById("child-content").innerHTML=`<div class="toolbar"><strong>${esc(child.label||key)}</strong><span class="muted">${rows.length} records</span></div><table><tr>${attrs.map(a=>`<th>${a}</th>`).join("")}</tr>${body}</table>`;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("tab-"+key).classList.add("active")}
async function operate(name,id,opName){const op=model[name].operations[opName],data={};for(const [p,s] of Object.entries(op.parameters||{})){if(s.type==="reference"){const rows=await api("/data/"+s.entity),key=model[s.entity].key;const answer=prompt((op.label||opName)+" — "+p+"\n"+rows.map(x=>x[key]+" : "+(x.name||"")).join("\n"));if(answer===null)return;data[p]=answer}else{const answer=prompt((op.label||opName)+" — "+p);if(answer===null)return;data[p]=answer}}try{await api("/api/"+name+"/"+opName,{method:"POST",body:{id,data}});show(name,id)}catch(e){alert(e.message)}}
async function edit(name,raw){const e=model[name],r=raw?JSON.parse(raw):{};const refs={};for(const [a,s] of Object.entries(e.attributes))if(s.type==="reference")refs[a]=await api("/data/"+s.entity);
content.innerHTML=`<div class="card"><p><a onclick="list('${name}')">← Cancel</a></p><h2>${raw?"Edit":"Create"} ${name}</h2><form id="form">${Object.entries(e.attributes).filter(([a,s])=>!(s.generated&&!raw)).map(([a,s])=>`<label class="field"><strong>${a}${s.required?" *":""}</strong>${s.type==="reference"?`<select name="${a}"><option value="">—</option>${refs[a].map(x=>`<option value="${esc(x[model[s.entity].key])}" ${x[model[s.entity].key]===r[a]?"selected":""}>${esc(x.name||x[model[s.entity].key])}</option>`).join("")}</select>`:`<input name="${a}" value="${esc(r[a])}" ${a===e.key&&raw?"readonly":""} ${s.required?"required":""}>`}</label>`).join("")}<button class="btn primary" type="submit">Save</button></form></div>`;
form.onsubmit=async ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>{if(data[k]==="")delete data[k]});try{if(raw){const id=r[e.key];delete data[e.key];await api("/data/"+name+"/"+encodeURIComponent(id),{method:"PATCH",body:data});show(name,id)}else{const x=await api("/data/"+name,{method:"POST",body:data});show(name,x[e.key])}}catch(err){alert(err.message)}}}
async function remove(name,id){if(!confirm("Delete this "+name+"?"))return;try{await api("/data/"+name+"/"+encodeURIComponent(id),{method:"DELETE"});list(name)}catch(e){alert(e.message)}}
start().catch(e=>content.textContent=e.message);
</script></body></html>
